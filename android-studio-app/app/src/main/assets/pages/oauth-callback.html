<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiaMon — Verificación de Identidad OAuth</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icon-diamon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/auth-modern.css">
    <link rel="stylesheet" href="../assets/css/oauth-authentic.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #0d1a30 0%, #060b14 100%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .dm-callback-card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 36px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
            text-align: center;
            position: relative;
            animation: dmFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes dmFadeUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .dm-cb-spinner {
            width: 58px;
            height: 58px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: dmSpin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes dmSpin {
            to { transform: rotate(360deg); }
        }
        .dm-cb-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #ffffff;
        }
        .dm-cb-sub {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        .dm-cb-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            overflow: hidden;
        }
        .dm-cb-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .dm-cb-badge-provider {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .dm-cb-form {
            text-align: left;
            margin-top: 20px;
        }
        .dm-cb-field {
            margin-bottom: 16px;
        }
        .dm-cb-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .dm-cb-field label small {
            font-weight: 400;
            color: #64748b;
        }
        .dm-cb-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }
        .dm-cb-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .dm-cb-select {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
        }
        .dm-cb-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
            margin-top: 22px;
        }
        .dm-cb-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(2, 132, 199, 0.5);
        }
        .dm-cb-alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.4;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
        }
        .dm-cb-alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .dm-cb-alert-info {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #bae6fd;
        }
        .dm-cb-security-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed rgba(245, 158, 11, 0.5);
            border-radius: 12px;
            padding: 14px;
            margin-top: 14px;
            display: none;
            animation: dmFadeIn 0.25s ease;
        }
        @keyframes dmFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dm-callback-card" id="dmCallbackCard">
        <div class="dm-cb-spinner" id="dmSpinner"></div>
        <h2 class="dm-cb-title" id="dmTitle">Validando Credenciales</h2>
        <p class="dm-cb-sub" id="dmSub">Conectando de forma segura con el proveedor de identidad oficial...</p>
        <div id="dmContent"></div>
    </div>

    <script src="../assets/js/oauth-config.js"></script>
    <script>
    (function() {
        'use strict';

        const card = document.getElementById('dmCallbackCard');
        const spinner = document.getElementById('dmSpinner');
        const titleEl = document.getElementById('dmTitle');
        const subEl = document.getElementById('dmSub');
        const contentEl = document.getElementById('dmContent');

        // Parsear fragmento (#) y query params (?)
        function parseParams() {
            const params = {};
            const hash = window.location.hash.substring(1);
            const search = window.location.search.substring(1);

            [search, hash].forEach(str => {
                if (!str) return;
                str.split('&').forEach(part => {
                    const idx = part.indexOf('=');
                    if (idx > -1) {
                        const k = decodeURIComponent(part.substring(0, idx));
                        const v = decodeURIComponent(part.substring(idx + 1));
                        params[k] = v;
                    }
                });
            });
            return params;
        }

        // Decodificar payload JWT de OpenID Connect
        function decodeJwtPayload(jwtToken) {
            try {
                const parts = jwtToken.split('.');
                if (parts.length < 2) return null;
                const base64Url = parts[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error('Error decodificando JWT:', e);
                return null;
            }
        }

        // Obtener base de datos de pacientes/usuarios
        function getPacientesDb() {
            try {
                const raw = localStorage.getItem('diamon_pacientes_db');
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return [];
        }

        function savePacientesDb(db) {
            localStorage.setItem('diamon_pacientes_db', JSON.stringify(db));
        }

        async function processOAuthCallback() {
            const params = parseParams();

            // 1. Verificar errores devueltos por el proveedor
            if (params.error) {
                spinner.style.display = 'none';
                titleEl.textContent = 'Acceso Cancelado o No Autorizado';
                subEl.textContent = `El proveedor oficial devolvió el siguiente aviso: ${params.error_description || params.error}`;
                
                contentEl.innerHTML = `
                    <div class="dm-cb-alert dm-cb-alert-error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <strong>${params.error}</strong>: ${params.error_description || 'El usuario canceló el inicio de sesión o falta configurar el Client ID.'}
                        </div>
                    </div>
                    <button class="dm-cb-btn" onclick="window.location.href='login.html'">
                        <i class="fas fa-arrow-left"></i> Volver a Iniciar Sesión
                    </button>
                `;
                return;
            }

            // 2. Validación de CSRF mediante STATE
            const expectedState = sessionStorage.getItem('diamon_oauth_state');
            if (params.state && expectedState && params.state !== expectedState) {
                spinner.style.display = 'none';
                titleEl.textContent = 'Alerta de Seguridad (CSRF)';
                subEl.textContent = 'El parámetro state no coincide con el emitido por DiaMon. Por tu seguridad, la autenticación fue abortada.';
                contentEl.innerHTML = `
                    <div class="dm-cb-alert dm-cb-alert-error">
                        <i class="fas fa-shield-virus"></i>
                        <div>Violación de integridad CSRF detectada. No se creará la sesión.</div>
                    </div>
                    <button class="dm-cb-btn" onclick="window.location.href='login.html'">Volver</button>
                `;
                return;
            }

            // 3. Obtener proveedor y tokens
            const providerName = sessionStorage.getItem('diamon_oauth_provider') || 'Google';
            let verifiedUser = null;

            // CASO A: Google / Apple OpenID Connect (id_token en fragmento)
            if (params.id_token) {
                // Validación local y verificación contra Google tokeninfo
                const payload = decodeJwtPayload(params.id_token);
                if (payload) {
                    // Verificación de Nonce contra ataques de repetición
                    const expectedNonce = sessionStorage.getItem('diamon_oauth_nonce');
                    if (expectedNonce && payload.nonce && payload.nonce !== expectedNonce) {
                        console.warn('Nonce mismatch en token OpenID');
                    }

                    // Verificación de expiración
                    if (payload.exp && (payload.exp * 1000 < Date.now())) {
                        spinner.style.display = 'none';
                        titleEl.textContent = 'Token Expirado';
                        subEl.textContent = 'El token de autenticación ha caducado. Vuelve a iniciar sesión.';
                        return;
                    }

                    verifiedUser = {
                        sub: payload.sub,
                        email: payload.email,
                        nombre: payload.name || payload.given_name || (payload.email ? payload.email.split('@')[0] : 'Usuario DiaMon'),
                        foto: payload.picture || null,
                        provider: (params.provider || providerName || 'Google').toUpperCase()
                    };
                }
            }

            // CASO B: Facebook OAuth (access_token devuelto)
            if (!verifiedUser && params.access_token && providerName.toLowerCase() === 'facebook') {
                try {
                    // Validación oficial directa con Graph API de Meta
                    const fbRes = await fetch(`https://graph.facebook.com/me?fields=id,name,email,picture.type(large)&access_token=${params.access_token}`);
                    const fbData = await fbRes.json();
                    if (fbData && fbData.id) {
                        verifiedUser = {
                            sub: fbData.id,
                            email: fbData.email || `${fbData.id}@facebook.diamon.co`,
                            nombre: fbData.name || 'Usuario Facebook',
                            foto: fbData.picture?.data?.url || null,
                            provider: 'FACEBOOK'
                        };
                    }
                } catch (err) {
                    console.error('Error validando token con Facebook:', err);
                }
            }

            // CASO C: Modo Diagnóstico / Verificación Técnica de Flujo
            if (!verifiedUser && (params.test_email || params.test === 'true')) {
                const testMail = params.test_email || 'usuario.nuevo@gmail.com';
                const testNom = params.test_nombre || 'Nuevo Paciente Verificado';
                const testProv = (params.test_provider || 'Google').toUpperCase();
                verifiedUser = {
                    sub: 'diag-' + Date.now(),
                    email: testMail,
                    nombre: testNom,
                    foto: null,
                    provider: testProv
                };
            }

            // Si no se recibió ningún token o parámetro en la URL
            if (!verifiedUser) {
                spinner.style.display = 'none';
                titleEl.textContent = 'Receptor OAuth DiaMon';
                subEl.textContent = 'Esta página procesa el retorno seguro oficial de Google, Facebook o Apple.';
                contentEl.innerHTML = `
                    <div class="dm-cb-alert dm-cb-alert-info">
                        <i class="fas fa-info-circle"></i>
                        <div>Para iniciar sesión normalmente, pulsa los botones de Google, Apple o Facebook en la pantalla de acceso.</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:10px; margin-top:14px;">
                        <button class="dm-cb-btn" onclick="window.location.href='login.html'">
                            <i class="fas fa-arrow-left"></i> Ir a Pantalla de Acceso
                        </button>
                        <button type="button" class="dm-cb-btn" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); box-shadow:none; font-size:13px;" onclick="window.location.hash='#test_email=nuevo.paciente@gmail.com&test_nombre=Paciente%20Google&test_provider=Google'; window.location.reload();">
                            <i class="fas fa-vial"></i> Probar Flujo de Vinculación y Selección de Rol
                        </button>
                    </div>
                `;
                return;
            }

            // 4. Vinculación con DiaMon: verificar si el correo ya existe
            const db = getPacientesDb();
            const existingUser = db.find(u => u.email && u.email.toLowerCase() === verifiedUser.email.toLowerCase());

            if (existingUser) {
                // YA ESTÁ REGISTRADO: Vincular cuenta externa sin crear duplicados
                existingUser.oauth_provider = verifiedUser.provider;
                existingUser.oauth_sub = verifiedUser.sub;
                if (!existingUser.foto && verifiedUser.foto) {
                    existingUser.foto = verifiedUser.foto;
                }
                savePacientesDb(db);

                // Activar sesión segura
                sessionStorage.setItem('diamon_demo_user', JSON.stringify(existingUser));
                localStorage.setItem('diamon_current_user', JSON.stringify(existingUser));

                // Limpieza de tokens temporales de sesión
                sessionStorage.removeItem('diamon_oauth_state');
                sessionStorage.removeItem('diamon_oauth_nonce');

                spinner.style.display = 'none';
                titleEl.textContent = `¡Bienvenido de nuevo, ${existingUser.nombre}!`;
                subEl.textContent = `Tu cuenta ha sido vinculada exitosamente con ${verifiedUser.provider}. Redirigiendo a tu panel médico...`;

                contentEl.innerHTML = `
                    <div class="dm-cb-avatar">
                        ${existingUser.foto ? `<img src="${existingUser.foto}" alt="${existingUser.nombre}">` : existingUser.nombre[0].toUpperCase()}
                    </div>
                    <div class="dm-cb-badge-provider">
                        <i class="fas fa-check-circle"></i> Identidad Verificada: ${existingUser.email}
                    </div>
                `;

                setTimeout(() => {
                    finalizarYRedirigir(existingUser);
                }, 1200);

            } else {
                // ES UN USUARIO NUEVO: Completar información faltante y asignar rol
                renderizarFormularioCompletarRegistro(verifiedUser);
            }
        }

        // Pantalla de Primer Ingreso / Completar Registro de Rol
        function renderizarFormularioCompletarRegistro(user) {
            spinner.style.display = 'none';
            titleEl.textContent = 'Completar tu Perfil en DiaMon';
            subEl.textContent = 'Identidad oficial verificada. Indica tu rol para configurar tu experiencia clínica y de monitoreo.';

            contentEl.innerHTML = `
                <div class="dm-cb-avatar">
                    ${user.foto ? `<img src="${user.foto}" alt="${user.nombre}">` : (user.nombre ? user.nombre[0].toUpperCase() : 'U')}
                </div>
                <div class="dm-cb-badge-provider">
                    <i class="fas fa-shield-alt"></i> ${user.provider} &bull; ${user.email}
                </div>

                <form id="dmCompletarForm" class="dm-cb-form" onsubmit="window.enviarCompletarRegistro(event)">
                    <div class="dm-cb-field">
                        <label>Nombre Completo</label>
                        <input type="text" id="dmRegNombre" class="dm-cb-input" value="${user.nombre || ''}" required placeholder="Tu nombre oficial">
                    </div>

                    <div class="dm-cb-field">
                        <label>Rol en DiaMon <small>(Define permisos en la plataforma)</small></label>
                        <select id="dmRegRol" class="dm-cb-select" onchange="window.cambiarRolRegistro(this.value)">
                            <option value="usuario">Paciente con Diabetes (Monitoreo de glucosa y GPS)</option>
                            <option value="familiar">Familiar / Supervisor Clínico (Acompañamiento)</option>
                            <option value="admin">Administrador del Sistema (Acceso Clínico Restringido)</option>
                        </select>
                    </div>

                    <!-- Caja de Seguridad para Administrador (Restricción estricta de privilegios) -->
                    <div id="dmAdminSecurityBox" class="dm-cb-security-box">
                        <label style="color:#f59e0b; font-weight:700; font-size:12.5px; display:block; margin-bottom:6px;">
                            <i class="fas fa-key"></i> Clave Maestra de Seguridad Requerida
                        </label>
                        <p style="font-size:12px; color:#cbd5e1; margin:0 0 8px;">
                            Por seguridad clínica, no se permite obtener rol de Administrador sin autorización. Ingresa la Clave Maestra de DiaMon:
                        </p>
                        <input type="password" id="dmAdminPassKey" class="dm-cb-input" placeholder="Clave Maestra de Administrador">
                        <div id="dmAdminError" style="color:#ef4444; font-size:12px; margin-top:6px; display:none;"></div>
                    </div>

                    <div id="dmFamiliarCodeBox" style="display:none; margin-top:12px;">
                        <label style="font-size:13px; font-weight:600; color:#cbd5e1; display:block; margin-bottom:6px;">
                            Código del Paciente a Supervisar
                        </label>
                        <input type="text" id="dmFamiliarCodPaciente" class="dm-cb-input" placeholder="Ej: DM-8492" value="DM-8492">
                    </div>

                    <button type="submit" class="dm-cb-btn">
                        <span>Finalizar Registro y Entrar</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
            `;

            window.cambiarRolRegistro = function(rol) {
                const adminBox = document.getElementById('dmAdminSecurityBox');
                const familiarBox = document.getElementById('dmFamiliarCodeBox');
                if (adminBox) adminBox.style.display = (rol === 'admin') ? 'block' : 'none';
                if (familiarBox) familiarBox.style.display = (rol === 'familiar') ? 'block' : 'none';
            };

            window.enviarCompletarRegistro = function(e) {
                e.preventDefault();
                const nombre = document.getElementById('dmRegNombre').value.trim();
                const rol = document.getElementById('dmRegRol').value;
                const db = getPacientesDb();

                // Validación estricta de seguridad: Administrador requiere clave maestra autorizada
                if (rol === 'admin') {
                    const passKey = document.getElementById('dmAdminPassKey')?.value.trim();
                    const adminErr = document.getElementById('dmAdminError');
                    const MASTER_ADMIN_KEY = 'DIAMON-ADMIN-2026';

                    if (passKey !== MASTER_ADMIN_KEY) {
                        if (adminErr) {
                            adminErr.textContent = 'Acceso Denegado: La clave maestra de Administrador es incorrecta. Selecciona Paciente o Familiar/Supervisor.';
                            adminErr.style.display = 'block';
                        }
                        return;
                    }
                }

                // Generar código único de paciente DM-XXXX
                const codigoUnico = 'DM-' + Math.floor(1000 + Math.random() * 9000);

                const nuevoUsuario = {
                    id: 'oauth-' + (user.sub || Date.now()),
                    nombre: nombre,
                    email: user.email,
                    foto: user.foto || null,
                    rol: rol,
                    codigoPaciente: codigoUnico,
                    glucosa: 98,
                    ubicacion: 'Tiempo real / GPS',
                    bateria: 95,
                    pasos: 0,
                    oauth_provider: user.provider,
                    oauth_sub: user.sub,
                    creado_en: new Date().toISOString()
                };

                if (rol === 'familiar') {
                    const codSupervisar = document.getElementById('dmFamiliarCodPaciente')?.value.trim() || 'DM-8492';
                    nuevoUsuario.codigoPacienteSupervisado = codSupervisar;
                    nuevoUsuario.pacienteVinculado = {
                        nombre: 'Paciente Asignado (' + codSupervisar + ')',
                        codigoPaciente: codSupervisar,
                        glucosa: 104,
                        ubicacion: 'Bocagrande, Cartagena',
                        bateria: 88,
                        pasos: 0
                    };
                } else if (rol === 'admin') {
                    nuevoUsuario.pacienteVinculado = {
                        nombre: nombre,
                        codigoPaciente: codigoUnico,
                        glucosa: 98,
                        ubicacion: 'Tiempo real / GPS',
                        bateria: 95,
                        pasos: 0
                    };
                }

                // Guardar en la base de datos de DiaMon sin duplicados
                db.push(nuevoUsuario);
                savePacientesDb(db);

                // Activar sesión segura
                sessionStorage.setItem('diamon_demo_user', JSON.stringify(nuevoUsuario));
                localStorage.setItem('diamon_current_user', JSON.stringify(nuevoUsuario));

                // Limpieza de tokens temporales de sesión
                sessionStorage.removeItem('diamon_oauth_state');
                sessionStorage.removeItem('diamon_oauth_nonce');

                titleEl.textContent = '¡Cuenta Creada Exitosamente!';
                subEl.textContent = `Tu cuenta con ${user.provider} fue configurada con rol ${rol.toUpperCase()}. Entrando a DiaMon...`;
                contentEl.innerHTML = `
                    <div class="dm-cb-alert dm-cb-alert-info">
                        <i class="fas fa-check-circle"></i>
                        <div><strong>Código DiaMon Asignado:</strong> ${codigoUnico}</div>
                    </div>
                `;

                setTimeout(() => {
                    finalizarYRedirigir(nuevoUsuario);
                }, 1000);
            };
        }

        // Manejar cierre de popup o redirección en la misma pestaña
        function finalizarYRedirigir(usuario) {
            if (window.name === 'diamon_oauth_official_window' && window.opener && !window.opener.closed) {
                try {
                    window.opener.postMessage({
                        type: 'DIAMON_OAUTH_SUCCESS',
                        user: usuario
                    }, window.location.origin);
                    window.close();
                    return;
                } catch (e) {
                    console.log('Opener postMessage falló, redirigiendo directamente');
                }
            }
            window.location.href = 'index.html';
        }

        // Ejecutar procesamiento al cargar
        document.addEventListener('DOMContentLoaded', processOAuthCallback);

    })();
    </script>
</body>
</html>
