<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiaMon — Monitoreo y Cuidado Inteligente</title>
    <meta name="description" content="DiaMon — Sistema inteligente de monitoreo de glucosa y cuidado continuo con telemetría GPS.">
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Identity Services Oficial -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Estilos de DiaMon -->
    <link rel="stylesheet" href="../assets/css/auth-modern.css">
    <link rel="stylesheet" href="../assets/css/oauth-authentic.css">
</head>
<body>

<!-- ==================== FONDO AMBIENTAL: SEDA AZUL 3D & PARTÍCULAS ==================== -->
<div class="dm-stage-bg" aria-hidden="true">
    <div class="dm-glow-orb dm-orb-1"></div>
    <div class="dm-glow-orb dm-orb-2"></div>
    <div class="dm-glow-orb dm-orb-3"></div>

    <!-- Cintas / Olas de seda 3D fluidas -->
    <svg class="dm-silk-waves" viewBox="0 0 1440 900" preserveAspectRatio="none" fill="none">
        <path class="dm-wave-path dm-wave-back" d="M-100 650 C 300 520, 600 780, 950 600 C 1200 480, 1400 580, 1600 520 L 1600 900 L -100 900 Z" fill="url(#waveGradBack)"/>
        <path class="dm-wave-path dm-wave-mid" d="M-100 720 C 250 600, 700 820, 1100 660 C 1300 590, 1450 670, 1600 630 L 1600 900 L -100 900 Z" fill="url(#waveGradMid)"/>
        <path class="dm-wave-path dm-wave-front" d="M-100 790 C 350 710, 800 870, 1200 760 C 1380 710, 1500 780, 1600 740 L 1600 900 L -100 900 Z" fill="url(#waveGradFront)"/>
        <defs>
            <linearGradient id="waveGradBack" x1="0" y1="500" x2="1440" y2="850" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0f766e" stop-opacity="0.45"/>
                <stop offset="0.5" stop-color="#0284c7" stop-opacity="0.25"/>
                <stop offset="1" stop-color="#031322" stop-opacity="0.9"/>
            </linearGradient>
            <linearGradient id="waveGradMid" x1="0" y1="550" x2="1440" y2="880" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0d9488" stop-opacity="0.5"/>
                <stop offset="0.45" stop-color="#0284c7" stop-opacity="0.32"/>
                <stop offset="1" stop-color="#041829" stop-opacity="0.95"/>
            </linearGradient>
            <linearGradient id="waveGradFront" x1="0" y1="650" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
                <stop stop-color="#14b8a6" stop-opacity="0.35"/>
                <stop offset="0.5" stop-color="#0284c7" stop-opacity="0.22"/>
                <stop offset="1" stop-color="#02101d" stop-opacity="0.98"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- Canvas para micro-partículas flotantes -->
    <canvas id="ambientCanvas"></canvas>
</div>

<!-- ==================== CONTROLES SUPERIORES (v1.0 & GRID) ==================== -->
<header class="dm-topbar-hud">
    <div class="dm-version-pill">v1.0</div>
    <a href="index.html" class="dm-grid-icon-btn" title="Ir al Dashboard Principal" aria-label="Dashboard DiaMon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="14" width="7" height="7" rx="2"></rect>
            <rect x="3" y="14" width="7" height="7" rx="2"></rect>
        </svg>
    </a>
</header>

<!-- ==================== ESCENARIO 3D ISOMÉTRICO CINEMATOGRÁFICO ==================== -->
<main class="dm-viewport-scene">
    <div class="dm-3d-stage">

        <!-- ==================== ELEMENTO 3D IZQUIERDO: GLUCÓMETRO ACOSTADO ==================== -->
        <div class="dm-isometric-element dm-element-left" aria-hidden="true">
            <!-- Gota 3D Flotante con Cruz (+) Luminosa -->
            <div class="dm-droplet-glow-wrapper">
                <div class="dm-droplet-aura"></div>
                <svg class="dm-droplet-svg" viewBox="0 0 100 130" fill="none">
                    <!-- Sombra de gota -->
                    <path d="M50 8C50 8 12 56 12 86C12 108 29 126 50 126C71 126 88 108 88 86C88 56 50 8 50 8Z" fill="url(#dropletGlowGrad)" filter="url(#dropBloom)"/>
                    <!-- Brillo de volumen curvado -->
                    <path d="M36 50C30 65 24 82 28 98C30 106 36 114 46 118" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round"/>
                    <path d="M42 42C40 45 36 52 34 60" stroke="rgba(255,255,255,0.9)" stroke-width="4" stroke-linecap="round"/>
                    <!-- Cruz Blanca Central (+) -->
                    <rect x="44" y="70" width="12" height="32" rx="3" fill="#ffffff" filter="url(#crossGlow)"/>
                    <rect x="34" y="80" width="32" height="12" rx="3" fill="#ffffff" filter="url(#crossGlow)"/>
                    <defs>
                        <radialGradient id="dropletGlowGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(42 68) rotate(55) scale(68)">
                            <stop stop-color="#bae6fd"/>
                            <stop offset="0.3" stop-color="#38bdf8"/>
                            <stop offset="0.7" stop-color="#2563eb"/>
                            <stop offset="1" stop-color="#172554"/>
                        </radialGradient>
                        <filter id="dropBloom" x="-20" y="-20" width="140" height="170" filterUnits="userSpaceOnUse">
                            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(56,189,248,0.7)"/>
                        </filter>
                        <filter id="crossGlow" x="20" y="60" width="60" height="60" filterUnits="userSpaceOnUse">
                            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff"/>
                        </filter>
                    </defs>
                </svg>
            </div>

            <!-- Glucómetro DiaMon 3D Tilted (Acostado en Perspectiva) -->
            <div class="dm-glucometer-chassis">
                <svg class="dm-glucometer-svg" viewBox="0 0 320 440" fill="none">
                    <!-- Sombra proyectada profunda sobre el plano base -->
                    <ellipse cx="160" cy="410" rx="130" ry="24" fill="rgba(0,0,0,0.65)" filter="blur(16px)"/>
                    
                    <!-- Ranura y Tira Reactiva Superior -->
                    <rect x="68" y="12" width="28" height="42" rx="6" fill="url(#stripMetalGrad)"/>
                    <rect x="74" y="6" width="16" height="12" rx="3" fill="#475569"/>
                    <line x1="74" y1="26" x2="90" y2="26" stroke="#0ea5e9" stroke-width="2"/>

                    <!-- Carcasa Exterior Ergonómica con Bisel 3D -->
                    <rect x="30" y="38" width="260" height="375" rx="58" fill="url(#deviceBodyGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>
                    <rect x="33" y="41" width="254" height="369" rx="55" fill="none" stroke="url(#deviceRimSheen)" stroke-width="1.5"/>

                    <!-- Pantalla LCD Digital Sumergida -->
                    <rect x="52" y="62" width="216" height="215" rx="36" fill="url(#screenDeepGrad)" stroke="rgba(56,189,248,0.35)" stroke-width="2"/>
                    
                    <!-- Reflejo diagonal curvo de cristal sobre la pantalla -->
                    <path d="M54 95 C 90 70, 185 64, 266 100 C 266 75, 245 64, 225 64 L 92 64 C 68 64, 56 75, 54 95 Z" fill="url(#screenGlassReflection)"/>

                    <!-- Lectura Principal: 98 en números grandes brillantes -->
                    <text x="160" y="165" class="dm-lcd-number" text-anchor="middle">98</text>
                    <text x="160" y="202" class="dm-lcd-unit" text-anchor="middle">mg/dL</text>

                    <!-- Icono de Gota de Glucosa en Pantalla -->
                    <path d="M160 220 C 160 220, 151 233, 151 240 C 151 245, 155 249, 160 249 C 165 249, 169 245, 169 240 C 169 233, 160 220, 160 220 Z" fill="#38bdf8" filter="url(#lcdGlow)"/>

                    <!-- Botón Central Concavo con Anillo Cromado y Relieve -->
                    <circle cx="160" cy="336" r="38" fill="url(#buttonRimGrad)" stroke="rgba(255,255,255,0.22)" stroke-width="1.8"/>
                    <circle cx="160" cy="336" r="30" fill="url(#buttonDimpleGrad)" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
                    <ellipse cx="160" cy="334" rx="20" ry="10" fill="rgba(255,255,255,0.08)"/>

                    <defs>
                        <linearGradient id="stripMetalGrad" x1="68" y1="12" x2="96" y2="54" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#e2e8f0"/>
                            <stop offset="0.6" stop-color="#94a3b8"/>
                            <stop offset="1" stop-color="#64748b"/>
                        </linearGradient>
                        <linearGradient id="deviceBodyGrad" x1="40" y1="40" x2="280" y2="410" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#1e3a66"/>
                            <stop offset="0.3" stop-color="#102542"/>
                            <stop offset="0.75" stop-color="#081527"/>
                            <stop offset="1" stop-color="#040c17"/>
                        </linearGradient>
                        <linearGradient id="deviceRimSheen" x1="33" y1="41" x2="287" y2="410" gradientUnits="userSpaceOnUse">
                            <stop stop-color="rgba(255,255,255,0.35)"/>
                            <stop offset="0.3" stop-color="rgba(56,189,248,0.2)"/>
                            <stop offset="0.7" stop-color="rgba(0,0,0,0.4)"/>
                            <stop offset="1" stop-color="rgba(255,255,255,0.08)"/>
                        </linearGradient>
                        <radialGradient id="screenDeepGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 145) rotate(90) scale(140 120)">
                            <stop stop-color="#0f2b52"/>
                            <stop offset="0.65" stop-color="#091a33"/>
                            <stop offset="1" stop-color="#040d1a"/>
                        </radialGradient>
                        <linearGradient id="screenGlassReflection" x1="54" y1="64" x2="266" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="rgba(255,255,255,0.22)"/>
                            <stop offset="0.7" stop-color="rgba(255,255,255,0.02)"/>
                            <stop offset="1" stop-color="transparent"/>
                        </linearGradient>
                        <radialGradient id="buttonRimGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 332) scale(38)">
                            <stop stop-color="#33588a"/>
                            <stop offset="0.7" stop-color="#152b47"/>
                            <stop offset="1" stop-color="#0b1726"/>
                        </radialGradient>
                        <radialGradient id="buttonDimpleGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 336) scale(30)">
                            <stop stop-color="#081321"/>
                            <stop offset="0.8" stop-color="#132742"/>
                            <stop offset="1" stop-color="#1d3b63"/>
                        </radialGradient>
                        <filter id="lcdGlow" x="120" y="90" width="80" height="90" filterUnits="userSpaceOnUse">
                            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="rgba(56,189,248,0.6)"/>
                        </filter>
                    </defs>
                </svg>
            </div>
        </div>

        <!-- ==================== ELEMENTO 3D DERECHO: PANEL TELEMETRÍA ECG ACOSTADO ==================== -->
        <div class="dm-isometric-element dm-element-right" aria-hidden="true">
            <div class="dm-telemetry-glass-board">
                <!-- Marco Holográfico con Vértices Médicos -->
                <div class="dm-telemetry-corner tl"></div>
                <div class="dm-telemetry-corner tr"></div>
                <div class="dm-telemetry-corner bl"></div>
                <div class="dm-telemetry-corner br"></div>

                <!-- Cabecera de Telemetría -->
                <div class="dm-board-header">
                    <div class="dm-signal-indicator">
                        <span class="dm-live-dot"></span>
                        <span class="dm-live-tag">LIVE ECG TELEMETRY</span>
                    </div>
                    <div class="dm-telemetry-rate">
                        <span class="dm-rate-val">74</span>
                        <span class="dm-rate-unit">BPM</span>
                    </div>
                </div>

                <!-- Gráfico de Pulso Cardíaco Animado (Onda ECG en Vivo) -->
                <div class="dm-ecg-screen">
                    <svg class="dm-ecg-svg" viewBox="0 0 340 180" fill="none">
                        <!-- Cuadrícula sutil de monitor clínico -->
                        <defs>
                            <pattern id="ecgGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="0.8"/>
                            </pattern>
                            <linearGradient id="ecgStrokeGrad" x1="0" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#0284c7" stop-opacity="0.3"/>
                                <stop offset="0.6" stop-color="#38bdf8"/>
                                <stop offset="0.8" stop-color="#ffffff"/>
                                <stop offset="1" stop-color="#38bdf8"/>
                            </linearGradient>
                            <linearGradient id="ecgAreaGrad" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
                                <stop stop-color="rgba(56, 189, 248, 0.25)"/>
                                <stop offset="1" stop-color="rgba(14, 165, 233, 0)"/>
                            </linearGradient>
                            <filter id="ecgGlowFilter" x="-10" y="-10" width="360" height="200" filterUnits="userSpaceOnUse">
                                <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="rgba(56, 189, 248, 0.9)"/>
                            </filter>
                        </defs>
                        <rect width="340" height="180" fill="url(#ecgGrid)"/>

                        <!-- Relleno de área translúcida bajo la onda -->
                        <path class="dm-ecg-area" d="M 0 110 L 40 110 L 60 110 L 75 95 L 85 110 L 110 110 L 125 110 L 135 45 L 145 160 L 155 85 L 165 120 L 175 110 L 210 110 L 225 90 L 245 110 L 275 110 L 290 45 L 300 160 L 310 85 L 320 110 L 340 110 L 340 180 L 0 180 Z" fill="url(#ecgAreaGrad)"/>

                        <!-- Línea de Onda Cardíaca Brillante Animada -->
                        <path class="dm-ecg-path" d="M 0 110 L 40 110 L 60 110 L 75 95 L 85 110 L 110 110 L 125 110 L 135 45 L 145 160 L 155 85 L 165 120 L 175 110 L 210 110 L 225 90 L 245 110 L 275 110 L 290 45 L 300 160 L 310 85 L 320 110 L 340 110" stroke="url(#ecgStrokeGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#ecgGlowFilter)"/>
                    </svg>
                </div>

                <!-- Onda sinusoidal suave inferior (Ritmo de Glucosa Continua) -->
                <div class="dm-wave-subtrack">
                    <svg viewBox="0 0 340 50" fill="none" class="dm-sine-svg">
                        <path d="M 0 25 Q 40 5, 80 25 T 160 25 T 240 25 T 320 25 T 360 25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
                        <path d="M 0 25 Q 40 38, 80 25 T 160 25 T 240 25 T 320 25 T 360 25" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>
                    </svg>
                </div>

                <!-- Barras de Métricas Clínicas -->
                <div class="dm-telemetry-footer-stats">
                    <div class="dm-tstat">
                        <span class="dm-tstat-lbl">SpO2</span>
                        <div class="dm-tbar"><div class="dm-tfill" style="width: 98%;"></div></div>
                        <span class="dm-tval">98%</span>
                    </div>
                    <div class="dm-tstat">
                        <span class="dm-tstat-lbl">ESTABILIDAD</span>
                        <div class="dm-tbar"><div class="dm-tfill" style="width: 92%;"></div></div>
                        <span class="dm-tval">92%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== CENTRO: TARJETA FROSTED GLASS TRANSLÚCIDA ==================== -->
        <div class="dm-center-card-layer">
            <div class="dm-frosted-glass-card">

                <!-- Header de la Tarjeta con Logo Oficial (Corazón + Pulso) -->
                <header class="dm-brand-header">
                    <div class="dm-brand-badge-glow">
                        <div class="dm-badge-radiance"></div>
                        <div class="dm-badge-icon">
                            <!-- Corazón con Electrocardiograma brillante -->
                            <svg width="44" height="44" viewBox="0 0 64 64" fill="none">
                                <path d="M32 58C32 58 6 42 6 24C6 14 14 6 24 6C29 6 32 10 32 10C32 10 35 6 40 6C50 6 58 14 58 24C58 42 32 58 32 58Z" fill="url(#heartBadgeGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
                                <!-- Pulso Eléctrico Blanco -->
                                <path d="M12 28 L 22 28 L 27 18 L 33 38 L 38 24 L 42 30 L 52 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseWhiteGlow)"/>
                                <defs>
                                    <linearGradient id="heartBadgeGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#14b8a6"/>
                                        <stop offset="0.5" stop-color="#0d9488"/>
                                        <stop offset="1" stop-color="#0284c7"/>
                                    </linearGradient>
                                    <filter id="pulseWhiteGlow" x="8" y="14" width="48" height="30" filterUnits="userSpaceOnUse">
                                        <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff"/>
                                    </filter>
                                </defs>
                            </svg>
                        </div>
                    </div>

                    <h1 class="dm-brand-title">DiaMon</h1>
                    <p class="dm-brand-subtitle">Monitoreo y Cuidado Inteligente</p>
                    
                    <div class="dm-tagline-wrap">
                        <span class="dm-tagline-line"></span>
                        <span class="dm-tagline-text">Tu salud, nuestra prioridad</span>
                        <span class="dm-tagline-line"></span>
                    </div>
                </header>

                <!-- Pestañas Píldora: Iniciar sesión / Crear cuenta -->
                <nav class="dm-pills-tabs-nav" role="tablist" aria-label="Modo de autenticación">
                    <button type="button" class="dm-tab-pill-btn active" data-tab="login" role="tab" aria-selected="true">
                        <i class="fas fa-user dm-tab-icon"></i>
                        <span>Iniciar sesión</span>
                    </button>
                    <button type="button" class="dm-tab-pill-btn" data-tab="register" role="tab" aria-selected="false">
                        <i class="fas fa-user-plus dm-tab-icon"></i>
                        <span>Crear cuenta</span>
                    </button>
                </nav>

                <!-- Selector de Perfil Oficial: Paciente vs Cuidador vs Administrador -->
                <div class="dm-role-selector-bar" role="radiogroup" aria-label="Perfil de acceso" style="grid-template-columns: 1fr 1fr 1fr;">
                    <button type="button" class="dm-role-choice-btn active" data-role="usuario" role="radio" aria-checked="true">
                        <i class="fas fa-user"></i>
                        <span>Paciente</span>
                    </button>
                    <button type="button" class="dm-role-choice-btn" data-role="cuidador" role="radio" aria-checked="false">
                        <i class="fas fa-user-nurse"></i>
                        <span>Cuidador</span>
                    </button>
                    <button type="button" class="dm-role-choice-btn" data-role="admin" role="radio" aria-checked="false">
                        <i class="fas fa-user-shield"></i>
                        <span>Admin</span>
                    </button>
                </div>

                <!-- ==================== FORMULARIO 1: INICIAR SESIÓN ==================== -->
                <form id="dmFormLogin" class="dm-auth-form" novalidate>
                    <!-- Campo: Correo Electrónico -->
                    <div class="dm-pill-field">
                        <div class="dm-field-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <input id="loginEmail" type="text" class="dm-capsule-input" placeholder="Correo electrónico o usuario" required autocomplete="username">
                    </div>

                    <!-- Campo: Contraseña con Ojo -->
                    <div class="dm-pill-field">
                        <div class="dm-field-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input id="loginPassword" type="password" class="dm-capsule-input" placeholder="Contraseña" required autocomplete="current-password">
                        <button type="button" class="dm-toggle-eye-btn" onclick="window.togglePasswordVisibility('loginPassword', this)" aria-label="Mostrar u ocultar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <!-- Fila Auxiliar: Recordarme & Olvidaste tu contraseña -->
                    <div class="dm-form-sub-row">
                        <label class="dm-remember-checkbox">
                            <input type="checkbox" id="rememberMe" checked>
                            <span class="dm-check-box-custom"></span>
                            <span class="dm-check-label-text">Recordarme</span>
                        </label>
                        <a href="#" class="dm-forgot-link" onclick="window.mostrarRecuperacion(); return false;">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Botón Principal "Entrar al Sistema" / "Ingresando..." -->
                    <button type="submit" id="dmLoginSubmitBtn" class="dm-action-pill-button">
                        <div class="dm-btn-sheen"></div>
                        <span class="dm-btn-spinner" aria-hidden="true"></span>
                        <span class="dm-btn-text">Entrar al Sistema</span>
                        <i class="fas fa-arrow-right dm-btn-arrow"></i>
                    </button>
                </form>

                <!-- ==================== FORMULARIO 2: CREAR CUENTA ==================== -->
                <form id="dmFormRegister" class="dm-auth-form" style="display: none;" novalidate>
                    <!-- Campo: Nombre Completo -->
                    <div class="dm-pill-field">
                        <div class="dm-field-icon">
                            <i class="fas fa-id-card"></i>
                        </div>
                        <input id="regNombre" type="text" class="dm-capsule-input" placeholder="Nombre completo" required autocomplete="name">
                    </div>

                    <!-- Campo: Correo Electrónico -->
                    <div class="dm-pill-field">
                        <div class="dm-field-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input id="regEmail" type="email" class="dm-capsule-input" placeholder="Correo electrónico" required autocomplete="email">
                    </div>

                    <!-- Campo: Contraseña -->
                    <div class="dm-pill-field">
                        <div class="dm-field-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input id="regPassword" type="password" class="dm-capsule-input" placeholder="Contraseña (mínimo 6 caracteres)" required autocomplete="new-password">
                        <button type="button" class="dm-toggle-eye-btn" onclick="window.togglePasswordVisibility('regPassword', this)" aria-label="Mostrar u ocultar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <!-- Campo Condicional solo al Crear Cuenta para Cuidador o Administrador -->
                    <div class="dm-admin-code-tray" id="regAdminCodeTray">
                        <div class="dm-pill-field dm-code-highlight">
                            <div class="dm-field-icon">
                                <i class="fas fa-link"></i>
                            </div>
                            <input id="regPatientCode" type="text" class="dm-capsule-input dm-code-uppercase" placeholder="Código único del paciente a supervisar" maxlength="24" autocomplete="off">
                        </div>
                    </div>

                    <!-- Botón de Registro -->
                    <button type="submit" id="dmRegSubmitBtn" class="dm-action-pill-button" style="margin-top: 10px;">
                        <div class="dm-btn-sheen"></div>
                        <span class="dm-btn-spinner" aria-hidden="true"></span>
                        <span class="dm-btn-text">Crear Cuenta en DiaMon</span>
                        <i class="fas fa-check dm-btn-arrow"></i>
                    </button>
                </form>

                <!-- Separador Elegante: "o continúa con" -->
                <div class="dm-divider-strip">
                    <span class="dm-divider-line"></span>
